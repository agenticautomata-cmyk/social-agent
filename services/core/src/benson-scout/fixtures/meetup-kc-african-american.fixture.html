e will begin with the **Sound of Soul Event.** We'll enjoy a potluck lunch, music, hearing an audio excerpt from Paul Twitchell, and much more.\nIt's sure to be a fun day.\n\nPlease bring a dish to share. Drinks and tableware will be provided.","eventType":"PHYSICAL","eventUrl":"https://www.meetup.com/eckankarinkansascity/events/314998543/","isAttending":false,"isSaved":false,"maxTickets":0,"rsvpState":"JOIN_OPEN","featuredEventPhoto":{"__ref":"PhotoInfo:534453074"},"displayPhoto":{"__ref":"PhotoInfo:534453074"},"feeSettings":null,"group":{"__ref":"Group:2737212"},"socialProofInsights":{"__typename":"SocialProofInsights","isTrendingEvent":false,"totalInterestedUsers":30,"interestedUsersSample":[{"__typename":"Member","memberPhoto":{"__ref":"PhotoInfo:248938229"}},{"__typename":"Member","memberPhoto":{"__ref":"PhotoInfo:36087862"}},{"__typename":"Member","memberPhoto":{"__ref":"PhotoInfo:36095762"}},{"__typename":"Member","memberPhoto":{"__ref":"PhotoInfo:87815552"}},{"__typename":"Member","memberPhoto":{"__ref":"PhotoInfo:324405669"}},{"__typename":"Member","memberPhoto":{"__ref":"PhotoInfo:317499850"}},{"__typename":"Member","memberPhoto":{"__ref":"PhotoInfo:94975082"}}]},"rsvps":{"__typename":"RsvpConnection","totalCount":3,"edges":[{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":true,"member":{"__ref":"Member:11278090"}}},{"__typename":"RsvpEdge","node":{"__typename":"Rsvp","isHost":false,"member":{"__ref":"Member:479861665"}}}]},"series":null,"venue":null},"PhotoInfo:530160258":{"__typename":"PhotoInfo","baseUrl":"https://secure-content.meetupstatic.com/images/classic-events/","highResUrl":"https://secure.meetupstatic.com/photos/event/1/0/2/highres_530160258.jpeg","id":"530160258"},"PhotoInfo:509634246":{"__typename":"PhotoInfo","baseUrl":"https://secure-content.meetupstatic.com/images/classic-events/","highResUrl":"https://secure.meetupstatic.com/photos/event/d/3/e/6/highres_509634246.jpeg","id":"509634246"},"Group:21339807":{"__typename":"Group", 404932","name":"Jannah Superticioso","memberPhoto":null},"Event:311022846":{"__typename":"Event","id":"311022846","title":"South Africa Safari \u0026 Adventure for Women","dateTime":"2026-09-18T07:00:00-05:00","description":"Does the idea of going on safari make your heart do little goat kicks? Do you have a lower back tattoo that says “Hakuna Matata?” When you have the rare opportunity to spin a globe, is there ONE continent that you run your fingers over every damn time? *We made this trip of a lifetime just for you, Explorer Chick.*\n\nThis 10-day women-only South African safari is a bucket list adventure with an obscene amount of relaxation and adrenaline. There will be kayaking with penguins. Cage diving with sharks. Multiple wine tastings (including a women-owned vineyard!). Poolside lounging in the bush. Two in-country flights in and out of the Kruger National Park region. THREE FULL SAFARI DAYS to see lions, elephants, and leopards. A scenic hike up and cable ride down Table Mountain. A photo opp stop in Cape Town’s most colorful neighborhood. And a soul-bursting tour of Nelson Mandela’s home turf.\n\nBest of all––you get to see each golden sunrise and fiery sunset with a badass bus of women who love to travel just as much as you. You’ll laugh. You’ll cry. You’ll never want to leave. Your goosebumps will get goosebumps as every meal, logistic, and pee break is planned by someone who isn’t you.\n\nOrder the most cargo pocket-y safari pants and bring your birding binoculars. You’re gonna experience a lifetime of feelings. Because time hits different when you spend it in Africa with your new besties.\n\n**See the website for full itinerary, details and to book.**\n[https://explorerchick.com/trip/south-africa-safari-adventure-for-women/](https://explorerchick.com/trip/south-africa-safari-adventure-for-women/)\n\n**Say Hello 👋**\n**💻** Website: [https://explorerchick.com/](https://explorerchick.com/)\n📧 Email: hello@explorerchick.com\n📸 Instagram: [https://www.in
