<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="1440" height="1000" fill="#0a0a0b"/>

  <!-- Header -->
  <rect x="0" y="0" width="1440" height="56" fill="#111114"/>
  <line x1="0" y1="56" x2="1440" y2="56" stroke="#27272a"/>
  <g font-family="ui-monospace,monospace">
    <text x="40" y="35" fill="#0ea5e9" font-size="14" font-weight="700">/</text>
    <text x="49" y="35" fill="#f4f4f5" font-size="14" font-weight="600">social-agent</text>
  </g>
  <g font-size="13" fill="#a1a1aa">
    <text x="180" y="35">Overview</text>
    <text x="270" y="35">Campaigns</text>
    <text x="370" y="35">Queue</text>
    <text x="440" y="35">Approvals</text>
    <text x="540" y="35">Runs</text>
  </g>
  <text x="1340" y="35" fill="#52525b" font-size="11" font-family="ui-monospace,monospace">demo mode · v0.1</text>

  <!-- Page heading -->
  <text x="120" y="120" fill="#f4f4f5" font-size="22" font-weight="600">Overview</text>
  <text x="120" y="148" fill="#a1a1aa" font-size="13">Pipeline health across all campaigns.</text>

  <!-- Stat tiles -->
  <g>
    <g><rect x="120" y="180" width="244" height="84" rx="8" fill="#111114" stroke="#27272a"/>
       <text x="140" y="208" fill="#52525b" font-size="11" letter-spacing="1">PLANNED</text>
       <text x="140" y="248" fill="#d4d4d8" font-size="32" font-weight="600">12</text>
    </g>
    <g><rect x="380" y="180" width="244" height="84" rx="8" fill="#111114" stroke="#27272a"/>
       <text x="400" y="208" fill="#52525b" font-size="11" letter-spacing="1">IN FLIGHT</text>
       <text x="400" y="248" fill="#7dd3fc" font-size="32" font-weight="600">7</text>
    </g>
    <g><rect x="640" y="180" width="244" height="84" rx="8" fill="#111114" stroke="#27272a"/>
       <text x="660" y="208" fill="#52525b" font-size="11" letter-spacing="1">SCHEDULED</text>
       <text x="660" y="248" fill="#86efac" font-size="32" font-weight="600">9</text>
    </g>
    <g><rect x="900" y="180" width="244" height="84" rx="8" fill="#111114" stroke="#27272a"/>
       <text x="920" y="208" fill="#52525b" font-size="11" letter-spacing="1">PUBLISHED</text>
       <text x="920" y="248" fill="#bbf7d0" font-size="32" font-weight="600">34</text>
    </g>
    <g><rect x="1160" y="180" width="160" height="84" rx="8" fill="#111114" stroke="#27272a"/>
       <text x="1180" y="208" fill="#52525b" font-size="11" letter-spacing="1">FAILED</text>
       <text x="1180" y="248" fill="#fca5a5" font-size="32" font-weight="600">1</text>
    </g>
  </g>

  <!-- Campaigns table -->
  <g>
    <text x="120" y="320" fill="#f4f4f5" font-size="16" font-weight="600">Campaigns</text>
    <text x="1290" y="320" fill="#0ea5e9" font-size="12" text-anchor="end">Manage →</text>

    <rect x="120" y="340" width="1200" height="200" rx="8" fill="#111114" stroke="#27272a"/>
    <rect x="120" y="340" width="1200" height="40" rx="8" fill="#1a1a1e"/>

    <g font-size="10" fill="#52525b" letter-spacing="1">
      <text x="140" y="365">CAMPAIGN</text>
      <text x="540" y="365">MODE</text>
      <text x="700" y="365">SCHEDULE</text>
      <text x="1280" y="365" text-anchor="end">WEEKLY TARGET</text>
    </g>

    <line x1="120" y1="380" x2="1320" y2="380" stroke="#27272a"/>

    <!-- Row 1 -->
    <text x="140" y="408" fill="#f4f4f5" font-size="13" font-weight="500">Demo Brand</text>
    <text x="140" y="427" fill="#52525b" font-size="11">Portfolio demo: a fictional growth-marketing brand serving local businesses</text>
    <rect x="540" y="396" width="56" height="22" rx="4" fill="#451a03" stroke="#92400e" stroke-opacity="0.3"/>
    <text x="568" y="411" fill="#fcd34d" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">hitl</text>
    <text x="700" y="411" fill="#a1a1aa" font-size="11" font-family="ui-monospace,monospace">0 9,17 * * *  Europe/Berlin</text>
    <text x="1290" y="411" text-anchor="end" fill="#d4d4d8" font-size="14" font-weight="500">33<tspan fill="#52525b" font-size="11">/wk</tspan></text>

    <line x1="120" y1="450" x2="1320" y2="450" stroke="#27272a"/>

    <!-- Row 2 (placeholder for visual fullness) -->
    <text x="140" y="478" fill="#a1a1aa" font-size="13">Acme Local Pro</text>
    <text x="140" y="497" fill="#52525b" font-size="11">Multi-tenant white-label run for the agency's clients</text>
    <rect x="540" y="466" width="56" height="22" rx="4" fill="#052e16" stroke="#14532d" stroke-opacity="0.3"/>
    <text x="568" y="481" fill="#86efac" font-size="11" font-family="ui-monospace,monospace" text-anchor="middle">auto</text>
    <text x="700" y="481" fill="#a1a1aa" font-size="11" font-family="ui-monospace,monospace">0 8,12,18 * * *  America/New_York</text>
    <text x="1290" y="481" text-anchor="end" fill="#d4d4d8" font-size="14" font-weight="500">52<tspan fill="#52525b" font-size="11">/wk</tspan></text>
  </g>

  <!-- State distribution -->
  <g>
    <text x="120" y="600" fill="#f4f4f5" font-size="16" font-weight="600">State distribution</text>
    <rect x="120" y="620" width="1200" height="320" rx="8" fill="#111114" stroke="#27272a"/>

    <g font-size="11">
      <!-- Row helper: x=140 (pill area), x=320 (bar start), x=1280 (count) -->
      <!-- Published -->
      <rect x="140" y="650" width="120" height="20" rx="4" fill="#064e3b" fill-opacity="0.5"/>
      <circle cx="152" cy="660" r="3" fill="#bbf7d0"/>
      <text x="162" y="664" fill="#bbf7d0" font-size="10" font-weight="500">Published</text>
      <rect x="320" y="654" width="900" height="12" rx="2" fill="#0a0a0b"/>
      <rect x="320" y="654" width="900" height="12" rx="2" fill="#0ea5e9" fill-opacity="0.6"/>
      <text x="1290" y="664" text-anchor="end" fill="#a1a1aa" font-family="ui-monospace,monospace">34</text>

      <!-- Planned -->
      <rect x="140" y="680" width="120" height="20" rx="4" fill="#27272a"/>
      <circle cx="152" cy="690" r="3" fill="#d4d4d8"/>
      <text x="162" y="694" fill="#d4d4d8" font-size="10" font-weight="500">Planned</text>
      <rect x="320" y="684" width="900" height="12" rx="2" fill="#0a0a0b"/>
      <rect x="320" y="684" width="318" height="12" rx="2" fill="#0ea5e9" fill-opacity="0.6"/>
      <text x="1290" y="694" text-anchor="end" fill="#a1a1aa" font-family="ui-monospace,monospace">12</text>

      <!-- Scheduled -->
      <rect x="140" y="710" width="120" height="20" rx="4" fill="#064e3b" fill-opacity="0.4"/>
      <circle cx="152" cy="720" r="3" fill="#86efac"/>
      <text x="162" y="724" fill="#86efac" font-size="10" font-weight="500">Scheduled</text>
      <rect x="320" y="714" width="900" height="12" rx="2" fill="#0a0a0b"/>
      <rect x="320" y="714" width="238" height="12" rx="2" fill="#0ea5e9" fill-opacity="0.6"/>
      <text x="1290" y="724" text-anchor="end" fill="#a1a1aa" font-family="ui-monospace,monospace">9</text>

      <!-- Awaiting approval -->
      <rect x="140" y="740" width="160" height="20" rx="4" fill="#451a03" fill-opacity="0.4"/>
      <circle cx="152" cy="750" r="3" fill="#fcd34d"/>
      <text x="162" y="754" fill="#fcd34d" font-size="10" font-weight="500">Awaiting approval</text>
      <rect x="320" y="744" width="900" height="12" rx="2" fill="#0a0a0b"/>
      <rect x="320" y="744" width="106" height="12" rx="2" fill="#0ea5e9" fill-opacity="0.6"/>
      <text x="1290" y="754" text-anchor="end" fill="#a1a1aa" font-family="ui-monospace,monospace">4</text>

      <!-- Generating -->
      <rect x="140" y="770" width="120" height="20" rx="4" fill="#3b0764" fill-opacity="0.4"/>
      <circle cx="152" cy="780" r="3" fill="#d8b4fe"/>
      <text x="162" y="784" fill="#d8b4fe" font-size="10" font-weight="500">Generating</text>
      <rect x="320" y="774" width="900" height="12" rx="2" fill="#0a0a0b"/>
      <rect x="320" y="774" width="80" height="12" rx="2" fill="#0ea5e9" fill-opacity="0.6"/>
      <text x="1290" y="784" text-anchor="end" fill="#a1a1aa" font-family="ui-monospace,monospace">3</text>

      <!-- Video ready -->
      <rect x="140" y="800" width="120" height="20" rx="4" fill="#3b0764" fill-opacity="0.4"/>
      <circle cx="152" cy="810" r="3" fill="#d8b4fe"/>
      <text x="162" y="814" fill="#d8b4fe" font-size="10" font-weight="500">Video ready</text>
      <rect x="320" y="804" width="900" height="12" rx="2" fill="#0a0a0b"/>
      <rect x="320" y="804" width="53" height="12" rx="2" fill="#0ea5e9" fill-opacity="0.6"/>
      <text x="1290" y="814" text-anchor="end" fill="#a1a1aa" font-family="ui-monospace,monospace">2</text>

      <!-- Failed -->
      <rect x="140" y="830" width="120" height="20" rx="4" fill="#450a0a" fill-opacity="0.4"/>
      <circle cx="152" cy="840" r="3" fill="#fca5a5"/>
      <text x="162" y="844" fill="#fca5a5" font-size="10" font-weight="500">Failed</text>
      <rect x="320" y="834" width="900" height="12" rx="2" fill="#0a0a0b"/>
      <rect x="320" y="834" width="27" height="12" rx="2" fill="#0ea5e9" fill-opacity="0.6"/>
      <text x="1290" y="844" text-anchor="end" fill="#a1a1aa" font-family="ui-monospace,monospace">1</text>
    </g>
  </g>
</svg>
