<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="1440" height="1100" fill="#0a0a0b"/>

  <!-- Header -->
  <rect x="0" y="0" width="1440" height="56" fill="#111114"/>
  <line x1="0" y1="56" x2="1440" y2="56" stroke="#27272a"/>
  <g font-family="ui-monospace,monospace">
    <text x="40" y="35" fill="#0ea5e9" font-size="14" font-weight="700">/</text>
    <text x="49" y="35" fill="#f4f4f5" font-size="14" font-weight="600">social-agent</text>
  </g>
  <g font-size="13" fill="#a1a1aa">
    <text x="180" y="35">Overview</text>
    <text x="270" y="35">Campaigns</text>
    <text x="370" y="35">Queue</text>
    <text x="440" y="35" fill="#f4f4f5">Approvals</text>
    <text x="540" y="35">Runs</text>
  </g>
  <text x="1340" y="35" fill="#52525b" font-size="11" font-family="ui-monospace,monospace">demo mode · v0.1</text>

  <!-- Page heading -->
  <text x="120" y="120" fill="#f4f4f5" font-size="22" font-weight="600">Approvals</text>
  <text x="120" y="148" fill="#a1a1aa" font-size="13">Scripts awaiting human review. Reject sends back to the planner with feedback;</text>
  <text x="120" y="168" fill="#a1a1aa" font-size="13">script-writer regenerates with the rejection reason in the prompt.</text>

  <!-- Card 1 -->
  <g>
    <rect x="120" y="200" width="1200" height="430" rx="8" fill="#111114" stroke="#27272a"/>

    <g font-size="11" fill="#52525b" font-family="ui-monospace,monospace">
      <text x="140" y="232">testimonial</text>
      <text x="220" y="232">·</text>
      <text x="232" y="232" font-family="ui-sans-serif">Dentists</text>
      <text x="295" y="232">·</text>
      <text x="307" y="232">EN</text>
      <text x="335" y="232">·</text>
      <text x="347" y="232" font-family="ui-sans-serif">Dr. Maya Hartwell</text>
    </g>
    <text x="140" y="262" fill="#f4f4f5" font-size="18" font-weight="600">How recall systems transformed dentists</text>
    <text x="1300" y="232" text-anchor="end" fill="#52525b" font-size="11" font-family="ui-monospace,monospace">5/5/2026, 7:34:12 AM</text>

    <!-- Hook -->
    <text x="140" y="298" fill="#52525b" font-size="10" letter-spacing="1">HOOK</text>
    <text x="140" y="320" fill="#e4e4e7" font-size="13">Most dentists owners get this completely wrong</text>

    <!-- Script -->
    <text x="140" y="350" fill="#52525b" font-size="10" letter-spacing="1">SCRIPT</text>
    <rect x="140" y="362" width="1160" height="160" rx="6" fill="#1a1a1e"/>
    <g font-size="12" fill="#d4d4d8">
      <text x="156" y="384">Most dentists owners get this completely wrong</text>
      <text x="156" y="406">Here's what most dentists get wrong about recall systems:</text>
      <text x="156" y="424">they treat it as a one-time fix instead of a system.</text>
      <text x="156" y="446">In 90 days we rebuilt this around three moves: identify the leak, plug it</text>
      <text x="156" y="464">with a process, then automate.</text>
      <text x="156" y="486">The result — measurable lift in week three.</text>
      <text x="156" y="508" fill="#7dd3fc">Book a 15-min audit at demobrand.example.com</text>
    </g>

    <!-- CTA -->
    <text x="140" y="552" fill="#52525b" font-size="10" letter-spacing="1">CTA</text>
    <text x="140" y="574" fill="#e4e4e7" font-size="13">Book a 15-min audit at demobrand.example.com</text>

    <!-- Action buttons -->
    <g>
      <rect x="140" y="595" width="120" height="32" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#14532d" stroke-opacity="0.5"/>
      <text x="200" y="615" fill="#86efac" font-size="13" text-anchor="middle">✓ Approve</text>
    </g>
    <g>
      <rect x="272" y="595" width="84" height="32" rx="6" fill="#1a1a1e" stroke="#27272a"/>
      <text x="314" y="615" fill="#a1a1aa" font-size="13" text-anchor="middle">Reject</text>
    </g>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="120" y="650" width="1200" height="200" rx="8" fill="#111114" stroke="#27272a"/>

    <g font-size="11" fill="#52525b" font-family="ui-monospace,monospace">
      <text x="140" y="682">case_study</text>
      <text x="216" y="682">·</text>
      <text x="228" y="682" font-family="ui-sans-serif">Coffee Shops</text>
      <text x="318" y="682">·</text>
      <text x="330" y="682">EN</text>
      <text x="358" y="682">·</text>
      <text x="370" y="682" font-family="ui-sans-serif">Tomás Ruiz</text>
    </g>
    <text x="140" y="712" fill="#f4f4f5" font-size="18" font-weight="600">How a coffee shop doubled foot traffic in 90 days</text>
    <text x="1300" y="682" text-anchor="end" fill="#52525b" font-size="11" font-family="ui-monospace,monospace">5/5/2026, 7:31:08 AM</text>

    <text x="140" y="748" fill="#52525b" font-size="10" letter-spacing="1">HOOK</text>
    <text x="140" y="770" fill="#e4e4e7" font-size="13">I helped a coffee shop double their revenue in 90 days</text>

    <text x="140" y="800" fill="#52525b" font-size="10" letter-spacing="1">SCRIPT</text>
    <text x="140" y="822" fill="#71717a" font-size="12" font-style="italic">+ 4 more lines · click to expand</text>
  </g>

  <!-- Card 3 -->
  <g>
    <rect x="120" y="870" width="1200" height="170" rx="8" fill="#111114" stroke="#27272a"/>

    <g font-size="11" fill="#52525b" font-family="ui-monospace,monospace">
      <text x="140" y="902">explainer</text>
      <text x="208" y="902">·</text>
      <text x="220" y="902" font-family="ui-sans-serif">Real Estate</text>
      <text x="304" y="902">·</text>
      <text x="316" y="902">EN</text>
    </g>
    <text x="140" y="932" fill="#f4f4f5" font-size="18" font-weight="600">Why past-client referrals matter for every real estate</text>
    <text x="1300" y="902" text-anchor="end" fill="#52525b" font-size="11" font-family="ui-monospace,monospace">5/5/2026, 7:28:44 AM</text>

    <text x="140" y="968" fill="#52525b" font-size="10" letter-spacing="1">HOOK</text>
    <text x="140" y="990" fill="#e4e4e7" font-size="13">Here's what nobody tells you about running a real estate</text>
  </g>
