<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="1" stop-color="#111114"/>
    </linearGradient>
    <linearGradient id="dash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="workers" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="ext" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0.05"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52525b"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Title -->
  <text x="40" y="48" fill="#f4f4f5" font-size="22" font-weight="700">social-agent — architecture</text>
  <text x="40" y="72" fill="#71717a" font-size="13">State-machine in Postgres · stateless workers · HITL → auto autonomy modes</text>

  <!-- Dashboard -->
  <g>
    <rect x="60" y="120" width="240" height="100" rx="10" fill="url(#dash)" stroke="#0ea5e9" stroke-opacity="0.5"/>
    <text x="180" y="155" text-anchor="middle" fill="#7dd3fc" font-size="13" font-weight="600">Dashboard</text>
    <text x="180" y="178" text-anchor="middle" fill="#a1a1aa" font-size="11">Next.js 15 · Tailwind</text>
    <text x="180" y="198" text-anchor="middle" fill="#71717a" font-size="10">campaigns · queue · approvals · runs</text>
  </g>

  <!-- API -->
  <g>
    <rect x="60" y="270" width="240" height="100" rx="10" fill="url(#api)" stroke="#22c55e" stroke-opacity="0.5"/>
    <text x="180" y="305" text-anchor="middle" fill="#86efac" font-size="13" font-weight="600">API</text>
    <text x="180" y="328" text-anchor="middle" fill="#a1a1aa" font-size="11">Hono · Zod · Node 20+</text>
    <text x="180" y="348" text-anchor="middle" fill="#71717a" font-size="10">REST · /campaigns /content /approvals</text>
  </g>

  <!-- Postgres -->
  <g>
    <rect x="500" y="170" width="280" height="200" rx="10" fill="url(#db)" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="640" y="205" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="600">Postgres + pgvector</text>
    <text x="640" y="225" text-anchor="middle" fill="#71717a" font-size="10">state machine · 11 tables</text>

    <line x1="525" y1="245" x2="755" y2="245" stroke="#27272a"/>

    <text x="540" y="265" fill="#d4d4d8" font-size="10" font-family="ui-monospace,monospace">campaigns</text>
    <text x="540" y="282" fill="#d4d4d8" font-size="10" font-family="ui-monospace,monospace">industries · campaign_industries</text>
    <text x="540" y="299" fill="#d4d4d8" font-size="10" font-family="ui-monospace,monospace">personas</text>
    <text x="540" y="316" fill="#d4d4d8" font-size="10" font-family="ui-monospace,monospace">content_items  ← state machine</text>
    <text x="540" y="333" fill="#d4d4d8" font-size="10" font-family="ui-monospace,monospace">assets · publications · publishing_targets</text>
    <text x="540" y="350" fill="#d4d4d8" font-size="10" font-family="ui-monospace,monospace">workflow_runs  ← audit log</text>
  </g>

  <!-- Workers -->
  <g>
    <rect x="930" y="120" width="290" height="290" rx="10" fill="url(#workers)" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="1075" y="155" text-anchor="middle" fill="#d8b4fe" font-size="13" font-weight="600">Workers</text>
    <text x="1075" y="175" text-anchor="middle" fill="#71717a" font-size="10">poll &amp; advance state · TS · Node</text>

    <line x1="950" y1="195" x2="1200" y2="195" stroke="#27272a"/>

    <g font-size="11" font-family="ui-monospace,monospace">
      <text x="950" y="218" fill="#d4d4d8">1. planner</text>
      <text x="1075" y="218" fill="#71717a">cron</text>
      <text x="950" y="240" fill="#d4d4d8">2. script-writer</text>
      <text x="1075" y="240" fill="#71717a">→ script_drafted</text>
      <text x="950" y="262" fill="#d4d4d8">3. approval-gate</text>
      <text x="1075" y="262" fill="#71717a">→ script_approved</text>
      <text x="950" y="284" fill="#d4d4d8">4. persona-picker</text>
      <text x="1075" y="284" fill="#71717a">→ assets_ready</text>
      <text x="950" y="306" fill="#d4d4d8">5. avatar-render</text>
      <text x="1075" y="306" fill="#71717a">→ video_ready</text>
      <text x="950" y="328" fill="#d4d4d8">6. post-production</text>
      <text x="1075" y="328" fill="#71717a">→ ready_to_publish</text>
      <text x="950" y="350" fill="#d4d4d8">7. scheduler</text>
      <text x="1075" y="350" fill="#71717a">→ scheduled</text>
      <text x="950" y="372" fill="#d4d4d8">8. publisher</text>
      <text x="1075" y="372" fill="#71717a">→ published</text>
    </g>
  </g>

  <!-- External -->
  <g>
    <rect x="500" y="470" width="660" height="100" rx="10" fill="url(#ext)" stroke="#ef4444" stroke-opacity="0.4"/>
    <text x="830" y="500" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">External APIs · gated by DEMO_MODE flag</text>

    <g font-size="11" font-family="ui-monospace,monospace" fill="#a1a1aa">
      <text x="540" y="535" text-anchor="start">OpenAI</text>
      <text x="650" y="535" text-anchor="start">Imagen</text>
      <text x="755" y="535" text-anchor="start">HeyGen</text>
      <text x="855" y="535" text-anchor="start">Instagram Graph</text>
      <text x="990" y="535" text-anchor="start">TikTok Posting</text>

      <text x="540" y="555" text-anchor="start" fill="#52525b" font-size="9">scripts · embeddings</text>
      <text x="650" y="555" text-anchor="start" fill="#52525b" font-size="9">portraits</text>
      <text x="755" y="555" text-anchor="start" fill="#52525b" font-size="9">avatar video</text>
      <text x="855" y="555" text-anchor="start" fill="#52525b" font-size="9">Reels publishing</text>
      <text x="990" y="555" text-anchor="start" fill="#52525b" font-size="9">Direct Post / Inbox</text>
    </g>
  </g>

  <!-- n8n -->
  <g>
    <rect x="60" y="470" width="350" height="100" rx="10" fill="url(#dash)" stroke="#0ea5e9" stroke-opacity="0.3"/>
    <text x="235" y="500" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="600">n8n workflows (orchestration layer)</text>
    <text x="235" y="525" text-anchor="middle" fill="#a1a1aa" font-size="10">cron triggers · Slack notifications · OAuth callbacks</text>
    <text x="235" y="548" text-anchor="middle" fill="#71717a" font-size="9">3 importable .json files in /n8n/workflows</text>
  </g>

  <!-- Arrows -->
  <g stroke="#52525b" stroke-width="1.5" fill="none">
    <!-- dashboard ↔ api -->
    <line x1="180" y1="220" x2="180" y2="270" marker-end="url(#arrow)"/>
    <text x="195" y="252" fill="#71717a" font-size="10">REST</text>

    <!-- api ↔ db -->
    <line x1="300" y1="320" x2="500" y2="270" marker-end="url(#arrow)"/>

    <!-- workers ↔ db -->
    <line x1="930" y1="265" x2="780" y2="265" marker-end="url(#arrow)"/>
    <text x="820" y="255" fill="#71717a" font-size="10">claim · advance state</text>

    <!-- workers ↔ external -->
    <line x1="1075" y1="410" x2="1075" y2="470" marker-end="url(#arrow)"/>

    <!-- n8n ↔ api -->
    <line x1="410" y1="500" x2="500" y2="480" marker-end="url(#arrow)" stroke-dasharray="3,3"/>
  </g>

  <!-- Footer -->
  <text x="40" y="690" fill="#3f3f46" font-size="10" font-family="ui-monospace,monospace">
    docker compose up · pnpm install · pnpm seed · pnpm dev:all  →  http://localhost:3000
  </text>
</svg>
