<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- Cream paper · hard ink · deep emerald accent · ASCII-ish boxes -->
  <rect width="1280" height="720" fill="#f5f1e8"/>

  <!-- Top wordmark -->
  <text x="48" y="44" fill="#0a0a0a" font-size="14" font-weight="700">social-agent</text>
  <text x="160" y="44" fill="#737373" font-size="12">// architecture</text>
  <text x="1232" y="44" text-anchor="end" fill="#737373" font-size="12">v0.3.0</text>

  <line x1="48" y1="60" x2="1232" y2="60" stroke="#0a0a0a" stroke-width="2"/>

  <!-- Section marker -->
  <text x="48" y="100" fill="#737373" font-size="11">─────  // dataflow</text>

  <!-- Boxes use sharp 1px borders, lowercase labels with bracketed roles -->

  <!-- Dashboard -->
  <g transform="translate(48, 130)">
    <rect x="0" y="0" width="240" height="120" fill="#f5f1e8" stroke="#0a0a0a" stroke-width="2"/>
    <text x="14" y="28" fill="#0a0a0a" font-size="13" font-weight="700">[ dashboard ]</text>
    <line x1="14" y1="36" x2="226" y2="36" stroke="#d6cdb8"/>
    <text x="14" y="58" fill="#737373" font-size="11">next.js 15 · tailwind</text>
    <text x="14" y="78" fill="#737373" font-size="11">overview · queue</text>
    <text x="14" y="96" fill="#737373" font-size="11">approvals · runs</text>
  </g>

  <!-- API -->
  <g transform="translate(48, 290)">
    <rect x="0" y="0" width="240" height="120" fill="#f5f1e8" stroke="#0a0a0a" stroke-width="2"/>
    <text x="14" y="28" fill="#0a0a0a" font-size="13" font-weight="700">[ api ]</text>
    <line x1="14" y1="36" x2="226" y2="36" stroke="#d6cdb8"/>
    <text x="14" y="58" fill="#737373" font-size="11">hono · zod · node 20</text>
    <text x="14" y="78" fill="#737373" font-size="11">/campaigns /content</text>
    <text x="14" y="96" fill="#737373" font-size="11">/approvals /runs /metrics</text>
  </g>

  <!-- Postgres -->
  <g transform="translate(440, 200)">
    <rect x="0" y="0" width="320" height="220" fill="#f5f1e8" stroke="#0a0a0a" stroke-width="2"/>
    <text x="14" y="28" fill="#0a0a0a" font-size="13" font-weight="700">[ postgres + pgvector ]</text>
    <line x1="14" y1="36" x2="306" y2="36" stroke="#0a0a0a"/>
    <text x="14" y="58" fill="#737373" font-size="11">// state machine + audit log</text>

    <text x="14" y="84" fill="#0a0a0a" font-size="11">campaigns · industries</text>
    <text x="14" y="102" fill="#0a0a0a" font-size="11">campaign_industries · personas</text>
    <text x="14" y="124" fill="#166534" font-size="11" font-weight="700">content_items     ← state machine</text>
    <text x="14" y="142" fill="#0a0a0a" font-size="11">assets · publications</text>
    <text x="14" y="160" fill="#0a0a0a" font-size="11">publishing_targets</text>
    <text x="14" y="178" fill="#166534" font-size="11" font-weight="700">workflow_runs     ← audit log</text>
    <text x="14" y="196" fill="#0a0a0a" font-size="11">platform_credentials</text>
    <text x="14" y="214" fill="#0a0a0a" font-size="11">post_metrics · topic_performance</text>
  </g>

  <!-- Workers -->
  <g transform="translate(920, 130)">
    <rect x="0" y="0" width="312" height="360" fill="#f5f1e8" stroke="#0a0a0a" stroke-width="2"/>
    <text x="14" y="28" fill="#0a0a0a" font-size="13" font-weight="700">[ workers ]</text>
    <line x1="14" y1="36" x2="298" y2="36" stroke="#0a0a0a"/>
    <text x="14" y="56" fill="#737373" font-size="11">// claim &amp; advance state · ts · node</text>

    <g font-size="11" fill="#0a0a0a">
      <text x="14" y="84">01.  planner</text>          <text x="170" y="84" fill="#737373">→ cron</text>
      <text x="14" y="106">02.  script-writer</text>   <text x="170" y="106" fill="#737373">→ script_drafted</text>
      <text x="14" y="128">03.  approval-gate</text>   <text x="170" y="128" fill="#737373">→ script_approved</text>
      <text x="14" y="150">04.  persona-picker</text>  <text x="170" y="150" fill="#737373">→ assets_ready</text>
      <text x="14" y="172">05.  avatar-render</text>   <text x="170" y="172" fill="#737373">→ video_ready</text>
      <text x="14" y="194">06.  post-production</text> <text x="170" y="194" fill="#737373">→ ready_to_publish</text>
      <text x="14" y="216">07.  scheduler</text>       <text x="170" y="216" fill="#737373">→ scheduled</text>
      <text x="14" y="238">08.  publisher</text>       <text x="170" y="238" fill="#737373">→ published</text>
      <text x="14" y="260">09.  token-rotation</text>  <text x="170" y="260" fill="#737373">→ hourly</text>
      <text x="14" y="282">10.  analytics-ingest</text><text x="170" y="282" fill="#737373">→ 30min</text>
    </g>
    <line x1="14" y1="298" x2="298" y2="298" stroke="#d6cdb8"/>
    <text x="14" y="318" fill="#737373" font-size="11">// for update skip locked</text>
    <text x="14" y="334" fill="#737373" font-size="11">// horizontal scaling free</text>
    <text x="14" y="350" fill="#737373" font-size="11">// crash recovery automatic</text>
  </g>

  <!-- External -->
  <g transform="translate(48, 540)">
    <rect x="0" y="0" width="1184" height="100" fill="#f5f1e8" stroke="#0a0a0a" stroke-width="2"/>
    <text x="14" y="28" fill="#0a0a0a" font-size="13" font-weight="700">[ external apis ]</text>
    <text x="200" y="28" fill="#737373" font-size="11">// gated by DEMO_MODE — every provider has a mock impl</text>
    <line x1="14" y1="36" x2="1170" y2="36" stroke="#0a0a0a"/>

    <g font-size="11">
      <text x="14" y="60" fill="#0a0a0a" font-weight="700">openai</text>
      <text x="14" y="78" fill="#737373">scripts · captions · embeddings</text>

      <text x="220" y="60" fill="#0a0a0a" font-weight="700">imagen</text>
      <text x="220" y="78" fill="#737373">persona portraits</text>

      <text x="400" y="60" fill="#0a0a0a" font-weight="700">heygen</text>
      <text x="400" y="78" fill="#737373">avatar video render</text>

      <text x="600" y="60" fill="#0a0a0a" font-weight="700">pexels</text>
      <text x="600" y="78" fill="#737373">b-roll videos</text>

      <text x="780" y="60" fill="#0a0a0a" font-weight="700">instagram graph</text>
      <text x="780" y="78" fill="#737373">reels publishing</text>

      <text x="1000" y="60" fill="#0a0a0a" font-weight="700">tiktok content posting</text>
      <text x="1000" y="78" fill="#737373">direct post · inbox</text>
    </g>
  </g>

  <!-- Connectors -->
  <g stroke="#0a0a0a" stroke-width="1.5" fill="none">
    <!-- dashboard → api -->
    <line x1="168" y1="250" x2="168" y2="290" marker-end="url(#arrow)"/>
    <text x="178" y="276" fill="#737373" font-size="10">REST</text>

    <!-- api → postgres -->
    <line x1="288" y1="350" x2="440" y2="310" marker-end="url(#arrow)"/>

    <!-- workers ↔ postgres -->
    <line x1="920" y1="290" x2="760" y2="290" marker-end="url(#arrow)"/>
    <text x="800" y="282" fill="#737373" font-size="10">claim · update</text>

    <!-- workers → external -->
    <line x1="1075" y1="490" x2="1075" y2="540" marker-end="url(#arrow)"/>

    <!-- api → external feedback (analytics ingest) -->
  </g>

  <!-- Footer -->
  <text x="48" y="700" fill="#737373" font-size="10">$ docker compose up · pnpm install · pnpm seed · pnpm dev:all  →  http://localhost:3000</text>
  <text x="1232" y="700" text-anchor="end" fill="#737373" font-size="10">github.com/anthonyonazure/social-agent</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a0a0a"/>
    </marker>
  </defs>
</svg>
