<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0.05" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>
  <rect width="1200" height="630" fill="url(#halo2)"/>

  <!-- Top-left wordmark -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="url(#logoBg)"/>
    <!-- sparkles glyph -->
    <path d="M 22 12 L 24 20 L 32 22 L 24 24 L 22 32 L 20 24 L 12 22 L 20 20 Z" fill="#ffffff"/>
    <text x="58" y="30" fill="#f4f4f5" font-size="20" font-weight="600" font-family="ui-monospace, monospace">social-agent</text>
  </g>

  <!-- Headline -->
  <text x="80" y="290" fill="#f4f4f5" font-size="68" font-weight="700" letter-spacing="-1.5">Self-running</text>
  <text x="80" y="370" fill="#f4f4f5" font-size="68" font-weight="700" letter-spacing="-1.5">social-video pipeline.</text>

  <!-- Sub -->
  <text x="80" y="430" fill="#a1a1aa" font-size="22" font-weight="400">
    State machine in Postgres · stateless TypeScript workers · n8n orchestration.
  </text>

  <!-- Feature pills -->
  <g transform="translate(80, 470)" font-family="ui-monospace, monospace" font-size="14">
    <g>
      <rect x="0" y="0" width="180" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-opacity="0.3"/>
      <text x="20" y="21" fill="#7dd3fc">HITL → autonomous</text>
    </g>
    <g transform="translate(196, 0)">
      <rect x="0" y="0" width="148" height="32" rx="16" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.3"/>
      <text x="20" y="21" fill="#d8b4fe">pgvector dedup</text>
    </g>
    <g transform="translate(360, 0)">
      <rect x="0" y="0" width="156" height="32" rx="16" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.3"/>
      <text x="20" y="21" fill="#86efac">IG + TikTok direct</text>
    </g>
    <g transform="translate(532, 0)">
      <rect x="0" y="0" width="148" height="32" rx="16" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.3"/>
      <text x="20" y="21" fill="#fbbf24">8 polling workers</text>
    </g>
  </g>

  <!-- Bottom right URL -->
  <text x="1120" y="580" text-anchor="end" fill="#52525b" font-size="14" font-family="ui-monospace, monospace">github.com/anthonyonazure/social-agent</text>

  <!-- Right-side mini diagram -->
  <g transform="translate(800, 90)">
    <!-- Box: Dashboard -->
    <rect x="0" y="0" width="240" height="50" rx="8" fill="#0e0e11" stroke="#0ea5e9" stroke-opacity="0.4"/>
    <text x="20" y="30" fill="#7dd3fc" font-size="13" font-family="ui-monospace,monospace">Dashboard</text>

    <!-- Arrow down -->
    <line x1="120" y1="50" x2="120" y2="86" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrowSmall)"/>

    <!-- Box: API + Postgres -->
    <rect x="0" y="90" width="240" height="80" rx="8" fill="#0e0e11" stroke="#22c55e" stroke-opacity="0.3"/>
    <text x="20" y="116" fill="#86efac" font-size="13" font-family="ui-monospace,monospace">API · Postgres</text>
    <text x="20" y="140" fill="#52525b" font-size="11" font-family="ui-monospace,monospace">state machine</text>
    <text x="20" y="158" fill="#52525b" font-size="11" font-family="ui-monospace,monospace">audit log</text>

    <!-- Arrow down -->
    <line x1="120" y1="170" x2="120" y2="206" stroke="#52525b" stroke-width="1.5" marker-end="url(#arrowSmall)"/>

    <!-- Box: Workers -->
    <rect x="0" y="210" width="240" height="146" rx="8" fill="#0e0e11" stroke="#a855f7" stroke-opacity="0.3"/>
    <text x="20" y="236" fill="#d8b4fe" font-size="13" font-family="ui-monospace,monospace">Workers</text>
    <text x="20" y="260" fill="#52525b" font-size="11" font-family="ui-monospace,monospace">planner</text>
    <text x="20" y="278" fill="#52525b" font-size="11" font-family="ui-monospace,monospace">script-writer</text>
    <text x="20" y="296" fill="#52525b" font-size="11" font-family="ui-monospace,monospace">avatar-render</text>
    <text x="20" y="314" fill="#52525b" font-size="11" font-family="ui-monospace,monospace">post-production</text>
    <text x="20" y="332" fill="#52525b" font-size="11" font-family="ui-monospace,monospace">scheduler</text>
    <text x="20" y="350" fill="#52525b" font-size="11" font-family="ui-monospace,monospace">publisher</text>
  </g>

  <defs>
    <marker id="arrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52525b"/>
    </marker>
  </defs>
</svg>
