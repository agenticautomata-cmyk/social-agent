<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="JetBrains Mono, ui-monospace, monospace">
  <rect width="1080" height="1080" fill="#f5f1e8"/>

  <!-- Top -->
  <text x="80" y="100" fill="#0a0a0a" font-size="22" font-weight="700">social-agent</text>
  <text x="80" y="124" fill="#737373" font-size="14">// autonomous social-video pipeline</text>
  <line x1="80" y1="148" x2="1000" y2="148" stroke="#0a0a0a" stroke-width="2"/>

  <text x="80" y="194" fill="#737373" font-size="14">─────  // v0.3.0</text>

  <!-- Headline — stacked because square -->
  <text x="80" y="356" fill="#0a0a0a" font-size="100" font-weight="700" letter-spacing="-3.5">self-running</text>
  <text x="80" y="456" fill="#166534" font-size="100" font-weight="700" letter-spacing="-3.5">social-video</text>
  <text x="80" y="556" fill="#166534" font-size="100" font-weight="700" letter-spacing="-3.5">pipeline.</text>

  <!-- Sub -->
  <text x="80" y="624" fill="#0a0a0a" font-size="20">// state-machine in postgres · stateless ts workers</text>
  <text x="80" y="652" fill="#737373" font-size="20">// n8n orchestration · hitl → autonomous flip</text>

  <!-- Stats -->
  <g transform="translate(80, 760)">
    <line x1="0" y1="-22" x2="920" y2="-22" stroke="#0a0a0a" stroke-width="2"/>

    <g>
      <text x="0" y="32" fill="#737373" font-size="13">CODE</text>
      <text x="0" y="116" fill="#0a0a0a" font-size="84" font-weight="700">4k+</text>
    </g>
    <line x1="240" y1="-22" x2="240" y2="160" stroke="#d6cdb8"/>
    <g transform="translate(290, 0)">
      <text x="0" y="32" fill="#737373" font-size="13">WORKERS</text>
      <text x="0" y="116" fill="#0a0a0a" font-size="84" font-weight="700">11</text>
    </g>
    <line x1="490" y1="-22" x2="490" y2="160" stroke="#d6cdb8"/>
    <g transform="translate(540, 0)">
      <text x="0" y="32" fill="#737373" font-size="13">STATES</text>
      <text x="0" y="116" fill="#0a0a0a" font-size="84" font-weight="700">13</text>
    </g>
    <line x1="710" y1="-22" x2="710" y2="160" stroke="#d6cdb8"/>
    <g transform="translate(760, 0)">
      <text x="0" y="32" fill="#737373" font-size="13">DEMO COST</text>
      <text x="0" y="116" fill="#166534" font-size="84" font-weight="700">$0</text>
    </g>

    <line x1="0" y1="160" x2="920" y2="160" stroke="#0a0a0a" stroke-width="2"/>
  </g>

  <!-- Footer pills -->
  <g transform="translate(80, 980)" font-size="16" fill="#0a0a0a">
    <text x="0" y="0">[ hitl ]</text>
    <text x="120" y="0">[ pgvector ]</text>
    <text x="280" y="0">[ ffmpeg ]</text>
    <text x="420" y="0">[ ig + tiktok ]</text>
    <text x="640" y="0">[ analytics ]</text>
  </g>
  <text x="80" y="1040" fill="#737373" font-size="13">github.com/anthonyonazure/social-agent</text>
</svg>
