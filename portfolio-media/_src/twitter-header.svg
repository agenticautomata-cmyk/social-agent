<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.8" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0.1" cy="1" r="0.7">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <linearGradient id="textWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f5"/>
      <stop offset="1" stop-color="#a1a1aa"/>
    </linearGradient>
    <linearGradient id="textAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <rect width="1500" height="500" fill="url(#halo)"/>
  <rect width="1500" height="500" fill="url(#halo2)"/>

  <!-- Twitter avatar covers bottom-left ~120x120 area; safe-zone is center+right -->

  <!-- Centered headline -->
  <g transform="translate(750, 220)">
    <text text-anchor="middle" fill="url(#textWhite)" font-size="60" font-weight="800" letter-spacing="-2">
      Autonomous pipelines.
    </text>
    <text text-anchor="middle" y="80" fill="url(#textAccent)" font-size="60" font-weight="800" letter-spacing="-2">
      State machines. LLMs at the edges.
    </text>
  </g>

  <!-- Pills row -->
  <g transform="translate(280, 360)" font-family="ui-monospace, monospace" font-size="16">
    <g>
      <rect x="0" y="0" width="200" height="44" rx="22" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-opacity="0.34"/>
      <text x="26" y="29" fill="#7dd3fc">TypeScript / Postgres</text>
    </g>
    <g transform="translate(216, 0)">
      <rect x="0" y="0" width="160" height="44" rx="22" fill="#a855f7" fill-opacity="0.14" stroke="#a855f7" stroke-opacity="0.34"/>
      <text x="26" y="29" fill="#d8b4fe">n8n / Next.js</text>
    </g>
    <g transform="translate(392, 0)">
      <rect x="0" y="0" width="174" height="44" rx="22" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.34"/>
      <text x="26" y="29" fill="#86efac">marketing growth</text>
    </g>
    <g transform="translate(582, 0)">
      <rect x="0" y="0" width="160" height="44" rx="22" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.34"/>
      <text x="26" y="29" fill="#fbbf24">AI agents</text>
    </g>
    <g transform="translate(758, 0)">
      <rect x="0" y="0" width="174" height="44" rx="22" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-opacity="0.34"/>
      <text x="26" y="29" fill="#fca5a5">cybersec / OSINT</text>
    </g>
  </g>
</svg>
