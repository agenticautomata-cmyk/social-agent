<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0.05" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
    <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="textWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f5"/>
      <stop offset="1" stop-color="#a1a1aa"/>
    </linearGradient>
    <linearGradient id="textAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#halo)"/>
  <rect width="1920" height="1080" fill="url(#halo2)"/>

  <!-- Top-left wordmark -->
  <g transform="translate(120, 120)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#logoBg)"/>
    <path d="M 32 16 L 35.5 28 L 47.5 31.5 L 35.5 35 L 32 47 L 28.5 35 L 16.5 31.5 L 28.5 28 Z" fill="#ffffff"/>
    <text x="84" y="42" fill="#f4f4f5" font-size="26" font-weight="600" font-family="ui-monospace, monospace">social-agent</text>
  </g>

  <!-- Tag -->
  <g transform="translate(120, 240)">
    <rect x="0" y="0" width="320" height="42" rx="21" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-opacity="0.32"/>
    <circle cx="22" cy="21" r="4" fill="#7dd3fc"/>
    <text x="40" y="28" fill="#7dd3fc" font-size="14" font-family="ui-monospace, monospace">v0.2.0 — portfolio release</text>
  </g>

  <!-- Headline -->
  <text x="120" y="430" fill="url(#textWhite)" font-size="118" font-weight="800" letter-spacing="-3.5">Self-running</text>
  <text x="120" y="540" fill="url(#textAccent)" font-size="118" font-weight="800" letter-spacing="-3.5">social-video pipeline.</text>

  <!-- Sub -->
  <text x="124" y="620" fill="#a1a1aa" font-size="28" font-weight="400">
    From campaign config to published Reels and TikToks — autonomously.
  </text>
  <text x="124" y="660" fill="#71717a" font-size="22" font-weight="400">
    State-machine in Postgres. TypeScript workers. n8n orchestration. Full HITL → autonomous gate.
  </text>

  <!-- Feature pills -->
  <g transform="translate(120, 730)" font-family="ui-monospace, monospace" font-size="20">
    <g>
      <rect x="0" y="0" width="280" height="50" rx="25" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-opacity="0.34"/>
      <text x="32" y="32" fill="#7dd3fc">11 stateless workers</text>
    </g>
    <g transform="translate(296, 0)">
      <rect x="0" y="0" width="234" height="50" rx="25" fill="#a855f7" fill-opacity="0.14" stroke="#a855f7" stroke-opacity="0.34"/>
      <text x="32" y="32" fill="#d8b4fe">pgvector dedup</text>
    </g>
    <g transform="translate(548, 0)">
      <rect x="0" y="0" width="234" height="50" rx="25" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.34"/>
      <text x="32" y="32" fill="#86efac">IG + TikTok</text>
    </g>
    <g transform="translate(800, 0)">
      <rect x="0" y="0" width="246" height="50" rx="25" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.34"/>
      <text x="32" y="32" fill="#fbbf24">ffmpeg post-prod</text>
    </g>
  </g>

  <!-- Stat strip -->
  <g transform="translate(120, 870)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g>
      <text x="0" y="60" fill="url(#textAccent)" font-size="80" font-weight="700" letter-spacing="-2">4k+</text>
      <text x="0" y="92" fill="#71717a" font-size="16" letter-spacing="0.5">LINES OF TS</text>
    </g>
    <g transform="translate(220, 0)">
      <text x="0" y="60" fill="url(#textAccent)" font-size="80" font-weight="700" letter-spacing="-2">8</text>
      <text x="0" y="92" fill="#71717a" font-size="16" letter-spacing="0.5">PIPELINE STAGES</text>
    </g>
    <g transform="translate(420, 0)">
      <text x="0" y="60" fill="url(#textAccent)" font-size="80" font-weight="700" letter-spacing="-2">13</text>
      <text x="0" y="92" fill="#71717a" font-size="16" letter-spacing="0.5">STATES</text>
    </g>
    <g transform="translate(560, 0)">
      <text x="0" y="60" fill="url(#textAccent)" font-size="80" font-weight="700" letter-spacing="-2">$0</text>
      <text x="0" y="92" fill="#71717a" font-size="16" letter-spacing="0.5">DEMO COST</text>
    </g>
  </g>

  <!-- Right side: dashboard mock card -->
  <g transform="translate(1180, 240)">
    <rect x="0" y="0" width="620" height="640" rx="16" fill="#0e0e11" stroke="#27272a" stroke-width="1.5"/>
    <!-- header bar -->
    <rect x="0" y="0" width="620" height="46" rx="16" fill="#15151a"/>
    <rect x="0" y="30" width="620" height="16" fill="#15151a"/>
    <circle cx="22" cy="23" r="6" fill="#ef4444" fill-opacity="0.5"/>
    <circle cx="42" cy="23" r="6" fill="#f59e0b" fill-opacity="0.5"/>
    <circle cx="62" cy="23" r="6" fill="#22c55e" fill-opacity="0.5"/>
    <text x="92" y="29" fill="#52525b" font-family="ui-monospace,monospace" font-size="12">localhost:3000/queue</text>

    <!-- title -->
    <text x="32" y="100" fill="#f4f4f5" font-size="20" font-weight="600">Pipeline</text>

    <!-- pipeline rows -->
    <g transform="translate(32, 130)" font-family="ui-monospace,monospace" font-size="14">
      <!-- Published -->
      <g>
        <rect x="0" y="0" width="100" height="30" rx="15" fill="#064e3b" fill-opacity="0.5"/>
        <circle cx="14" cy="15" r="3" fill="#bbf7d0"/>
        <text x="22" y="19" fill="#bbf7d0">Published</text>
        <rect x="120" y="9" width="380" height="12" rx="6" fill="#15151a"/>
        <rect x="120" y="9" width="380" height="12" rx="6" fill="url(#textAccent)" fill-opacity="0.7"/>
        <text x="520" y="19" fill="#86efac" text-anchor="end">34</text>
      </g>
      <!-- Scheduled -->
      <g transform="translate(0, 46)">
        <rect x="0" y="0" width="100" height="30" rx="15" fill="#064e3b" fill-opacity="0.4"/>
        <circle cx="14" cy="15" r="3" fill="#86efac"/>
        <text x="22" y="19" fill="#86efac">Scheduled</text>
        <rect x="120" y="9" width="380" height="12" rx="6" fill="#15151a"/>
        <rect x="120" y="9" width="120" height="12" rx="6" fill="url(#textAccent)" fill-opacity="0.7"/>
        <text x="520" y="19" fill="#86efac" text-anchor="end">9</text>
      </g>
      <!-- Generating -->
      <g transform="translate(0, 92)">
        <rect x="0" y="0" width="110" height="30" rx="15" fill="#3b0764" fill-opacity="0.4"/>
        <circle cx="14" cy="15" r="3" fill="#d8b4fe"/>
        <text x="22" y="19" fill="#d8b4fe">Generating</text>
        <rect x="120" y="9" width="380" height="12" rx="6" fill="#15151a"/>
        <rect x="120" y="9" width="60" height="12" rx="6" fill="url(#textAccent)" fill-opacity="0.7"/>
        <text x="520" y="19" fill="#d8b4fe" text-anchor="end">3</text>
      </g>
      <!-- Awaiting -->
      <g transform="translate(0, 138)">
        <rect x="0" y="0" width="156" height="30" rx="15" fill="#451a03" fill-opacity="0.5"/>
        <circle cx="14" cy="15" r="3" fill="#fcd34d"/>
        <text x="22" y="19" fill="#fcd34d">Awaiting approval</text>
        <rect x="170" y="9" width="330" height="12" rx="6" fill="#15151a"/>
        <rect x="170" y="9" width="100" height="12" rx="6" fill="url(#textAccent)" fill-opacity="0.7"/>
        <text x="520" y="19" fill="#fcd34d" text-anchor="end">4</text>
      </g>
      <!-- Planned -->
      <g transform="translate(0, 184)">
        <rect x="0" y="0" width="80" height="30" rx="15" fill="#27272a"/>
        <circle cx="14" cy="15" r="3" fill="#d4d4d8"/>
        <text x="22" y="19" fill="#d4d4d8">Planned</text>
        <rect x="100" y="9" width="400" height="12" rx="6" fill="#15151a"/>
        <rect x="100" y="9" width="160" height="12" rx="6" fill="url(#textAccent)" fill-opacity="0.7"/>
        <text x="520" y="19" fill="#d4d4d8" text-anchor="end">12</text>
      </g>
    </g>

    <!-- divider -->
    <line x1="32" y1="370" x2="588" y2="370" stroke="#27272a"/>

    <!-- queue rows -->
    <text x="32" y="400" fill="#f4f4f5" font-size="14" font-weight="600">Recent items</text>
    <g transform="translate(32, 420)" font-family="ui-monospace,monospace" font-size="12">
      <g>
        <rect x="0" y="0" width="74" height="22" rx="11" fill="#064e3b" fill-opacity="0.5"/>
        <circle cx="11" cy="11" r="2.5" fill="#bbf7d0"/>
        <text x="18" y="14" fill="#bbf7d0" font-size="10">Published</text>
        <text x="92" y="14" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">How recall systems transformed dentists</text>
      </g>
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="74" height="22" rx="11" fill="#064e3b" fill-opacity="0.5"/>
        <circle cx="11" cy="11" r="2.5" fill="#bbf7d0"/>
        <text x="18" y="14" fill="#bbf7d0" font-size="10">Published</text>
        <text x="92" y="14" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">How a coffee shop doubled foot traffic</text>
      </g>
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="80" height="22" rx="11" fill="#3b0764" fill-opacity="0.5"/>
        <circle cx="11" cy="11" r="2.5" fill="#d8b4fe"/>
        <text x="18" y="14" fill="#d8b4fe" font-size="10">Generating</text>
        <text x="98" y="14" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">Why past-client referrals matter for real estate</text>
      </g>
      <g transform="translate(0, 90)">
        <rect x="0" y="0" width="60" height="22" rx="11" fill="#064e3b" fill-opacity="0.4"/>
        <circle cx="11" cy="11" r="2.5" fill="#86efac"/>
        <text x="18" y="14" fill="#86efac" font-size="10">Ready</text>
        <text x="78" y="14" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">3 things every restaurant should know about online ordering</text>
      </g>
      <g transform="translate(0, 120)">
        <rect x="0" y="0" width="100" height="22" rx="11" fill="#451a03" fill-opacity="0.5"/>
        <circle cx="11" cy="11" r="2.5" fill="#fcd34d"/>
        <text x="18" y="14" fill="#fcd34d" font-size="10">Awaiting approval</text>
        <text x="118" y="14" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13">From skeptical to obsessed: a fitness studio story</text>
      </g>
    </g>

    <!-- footer -->
    <text x="32" y="610" fill="#52525b" font-family="ui-monospace,monospace" font-size="12">github.com/anthonyonazure/social-agent</text>
  </g>
</svg>
