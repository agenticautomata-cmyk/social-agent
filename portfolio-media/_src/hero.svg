<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="JetBrains Mono, ui-monospace, monospace">
  <rect width="1920" height="1080" fill="#f5f1e8"/>

  <!-- Top bar -->
  <text x="100" y="92" fill="#0a0a0a" font-size="22" font-weight="700">social-agent</text>
  <text x="270" y="92" fill="#737373" font-size="16">v0.3.0  //  autonomous social-video pipeline</text>
  <text x="1820" y="92" text-anchor="end" fill="#737373" font-size="14">github.com/anthonyonazure/social-agent</text>
  <line x1="100" y1="120" x2="1820" y2="120" stroke="#0a0a0a" stroke-width="2"/>

  <!-- Section marker -->
  <text x="100" y="175" fill="#737373" font-size="14">─────  // §1 thesis</text>

  <!-- Headline -->
  <text x="100" y="332" fill="#0a0a0a" font-size="120" font-weight="700" letter-spacing="-4">self-running</text>
  <text x="100" y="452" fill="#166534" font-size="120" font-weight="700" letter-spacing="-4">social-video pipeline.</text>

  <!-- Sub -->
  <text x="100" y="528" fill="#0a0a0a" font-size="26">// from campaign config to published reels and tiktoks — autonomously.</text>
  <text x="100" y="562" fill="#737373" font-size="20">// state-machine in postgres · stateless typescript workers · n8n orchestration · live dashboard with hitl approval gates</text>

  <!-- Stat strip — column-ruled -->
  <g transform="translate(100, 660)">
    <line x1="0" y1="-20" x2="1720" y2="-20" stroke="#0a0a0a" stroke-width="2"/>

    <g>
      <text x="0" y="36" fill="#737373" font-size="14">CODE</text>
      <text x="0" y="120" fill="#0a0a0a" font-size="92" font-weight="700">4,000+</text>
      <text x="0" y="156" fill="#737373" font-size="16">// lines of typescript</text>
    </g>

    <line x1="350" y1="-20" x2="350" y2="180" stroke="#d6cdb8"/>

    <g transform="translate(420, 0)">
      <text x="0" y="36" fill="#737373" font-size="14">WORKERS</text>
      <text x="0" y="120" fill="#0a0a0a" font-size="92" font-weight="700">11</text>
      <text x="0" y="156" fill="#737373" font-size="16">// stateless · for_update_skip_locked</text>
    </g>

    <line x1="900" y1="-20" x2="900" y2="180" stroke="#d6cdb8"/>

    <g transform="translate(960, 0)">
      <text x="0" y="36" fill="#737373" font-size="14">STATES</text>
      <text x="0" y="120" fill="#0a0a0a" font-size="92" font-weight="700">13</text>
      <text x="0" y="156" fill="#737373" font-size="16">// strict-forward state machine</text>
    </g>

    <line x1="1340" y1="-20" x2="1340" y2="180" stroke="#d6cdb8"/>

    <g transform="translate(1400, 0)">
      <text x="0" y="36" fill="#737373" font-size="14">DEMO COST</text>
      <text x="0" y="120" fill="#166534" font-size="92" font-weight="700">$0</text>
      <text x="0" y="156" fill="#737373" font-size="16">// runs without paid api keys</text>
    </g>

    <line x1="0" y1="180" x2="1720" y2="180" stroke="#0a0a0a" stroke-width="2"/>
  </g>

  <!-- Right-side feature column -->
  <g transform="translate(100, 880)" font-size="20" fill="#0a0a0a">
    <text x="0" y="0" fill="#737373" font-size="14">─────  // §2 features</text>
    <g transform="translate(0, 38)">
      <text x="0" y="0">[ hitl → autonomous ]</text>
      <text x="320" y="0">[ pgvector dedup ]</text>
      <text x="600" y="0">[ ig + tiktok direct ]</text>
      <text x="940" y="0">[ ffmpeg post-prod ]</text>
      <text x="1230" y="0">[ analytics feedback loop ]</text>
    </g>
  </g>

  <!-- Bottom rule + footer -->
  <line x1="100" y1="1010" x2="1820" y2="1010" stroke="#0a0a0a" stroke-width="2"/>
  <text x="100" y="1042" fill="#737373" font-size="14">$ docker compose up · pnpm install · pnpm seed · pnpm dev:all  →  http://localhost:3000</text>
  <text x="1820" y="1042" text-anchor="end" fill="#737373" font-size="14">v0.3.0 · 2026</text>
</svg>
