<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <linearGradient id="logoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="textAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Header -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="url(#logoBg)"/>
    <path d="M 22 10 L 24.5 19 L 33.5 21.5 L 24.5 24 L 22 33 L 19.5 24 L 10.5 21.5 L 19.5 19 Z" fill="#ffffff"/>
    <text x="60" y="28" fill="#f4f4f5" font-size="20" font-weight="600" font-family="ui-monospace, monospace">social-agent</text>
    <text x="60" y="48" fill="#71717a" font-size="14">portfolio at a glance</text>
  </g>

  <!-- Stat grid -->
  <g transform="translate(80, 200)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <!-- Row 1 -->
    <g>
      <rect x="0" y="0" width="240" height="160" rx="14" fill="#0e0e11" stroke="#27272a"/>
      <text x="20" y="38" fill="#52525b" font-size="11" letter-spacing="1.5">CODE</text>
      <text x="20" y="100" fill="url(#textAccent)" font-size="64" font-weight="700">4,000+</text>
      <text x="20" y="130" fill="#a1a1aa" font-size="14">lines of TypeScript</text>
      <text x="20" y="148" fill="#71717a" font-size="12">across 4 packages</text>
    </g>
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="240" height="160" rx="14" fill="#0e0e11" stroke="#27272a"/>
      <text x="20" y="38" fill="#52525b" font-size="11" letter-spacing="1.5">WORKERS</text>
      <text x="20" y="100" fill="url(#textAccent)" font-size="64" font-weight="700">11</text>
      <text x="20" y="130" fill="#a1a1aa" font-size="14">stateless workers</text>
      <text x="20" y="148" fill="#71717a" font-size="12">FOR UPDATE SKIP LOCKED</text>
    </g>
    <g transform="translate(520, 0)">
      <rect x="0" y="0" width="240" height="160" rx="14" fill="#0e0e11" stroke="#27272a"/>
      <text x="20" y="38" fill="#52525b" font-size="11" letter-spacing="1.5">STATES</text>
      <text x="20" y="100" fill="url(#textAccent)" font-size="64" font-weight="700">13</text>
      <text x="20" y="130" fill="#a1a1aa" font-size="14">pipeline states</text>
      <text x="20" y="148" fill="#71717a" font-size="12">with full audit log</text>
    </g>
    <g transform="translate(780, 0)">
      <rect x="0" y="0" width="260" height="160" rx="14" fill="#0e0e11" stroke="#27272a"/>
      <text x="20" y="38" fill="#52525b" font-size="11" letter-spacing="1.5">DEMO COST</text>
      <text x="20" y="100" fill="url(#textAccent)" font-size="64" font-weight="700">$0</text>
      <text x="20" y="130" fill="#a1a1aa" font-size="14">to run end-to-end</text>
      <text x="20" y="148" fill="#71717a" font-size="12">DEMO_MODE = mocks</text>
    </g>
    <!-- Row 2 -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="500" height="140" rx="14" fill="#0e0e11" stroke="#27272a"/>
      <text x="20" y="38" fill="#52525b" font-size="11" letter-spacing="1.5">STACK</text>
      <g transform="translate(20, 60)" font-family="ui-monospace, monospace" font-size="14">
        <text fill="#a1a1aa">Postgres + pgvector</text>
        <text x="0" y="22" fill="#a1a1aa">TypeScript / Drizzle / Hono / Next.js 15</text>
        <text x="0" y="44" fill="#a1a1aa">n8n orchestration · OpenAI / HeyGen / Pexels</text>
        <text x="0" y="66" fill="#a1a1aa">ffmpeg post-production · IG Graph / TikTok API</text>
      </g>
    </g>
    <g transform="translate(520, 180)">
      <rect x="0" y="0" width="520" height="140" rx="14" fill="#0e0e11" stroke="#27272a"/>
      <text x="20" y="38" fill="#52525b" font-size="11" letter-spacing="1.5">CAPABILITIES</text>
      <g transform="translate(20, 60)" font-size="14">
        <text fill="#86efac">✓ HITL approval gates · auto mode</text>
        <text x="0" y="22" fill="#86efac">✓ pgvector dedup against 90d history</text>
        <text x="0" y="44" fill="#86efac">✓ Multi-account + analytics feedback loop</text>
        <text x="0" y="66" fill="#86efac">✓ Token rotation · ffmpeg subtitles + CTA</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <text x="80" y="600" fill="#52525b" font-size="14" font-family="ui-monospace, monospace">github.com/anthonyonazure/social-agent</text>
  <text x="1120" y="600" text-anchor="end" fill="#52525b" font-size="14" font-family="ui-monospace, monospace">v0.2.0</text>
</svg>
