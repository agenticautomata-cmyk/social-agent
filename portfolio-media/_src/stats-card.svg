<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="JetBrains Mono, ui-monospace, monospace">
  <rect width="1200" height="630" fill="#f5f1e8"/>

  <!-- Top -->
  <text x="80" y="80" fill="#0a0a0a" font-size="20" font-weight="700">social-agent</text>
  <text x="220" y="80" fill="#737373" font-size="14">// portfolio at a glance</text>
  <text x="1120" y="80" text-anchor="end" fill="#737373" font-size="14">v0.3.0</text>
  <line x1="80" y1="100" x2="1120" y2="100" stroke="#0a0a0a" stroke-width="2"/>

  <!-- Stat grid — bordered cells, ASCII-feel -->
  <g transform="translate(80, 150)">
    <!-- 4 columns top row -->
    <g>
      <rect x="0" y="0" width="240" height="160" fill="#f5f1e8" stroke="#0a0a0a" stroke-width="1.5"/>
      <text x="16" y="32" fill="#737373" font-size="11">CODE</text>
      <text x="16" y="100" fill="#0a0a0a" font-size="56" font-weight="700">4,000+</text>
      <text x="16" y="128" fill="#737373" font-size="11">// lines of typescript</text>
      <text x="16" y="146" fill="#737373" font-size="11">// across 4 packages</text>
    </g>
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="240" height="160" fill="#f5f1e8" stroke="#0a0a0a" stroke-width="1.5"/>
      <text x="16" y="32" fill="#737373" font-size="11">WORKERS</text>
      <text x="16" y="100" fill="#0a0a0a" font-size="56" font-weight="700">11</text>
      <text x="16" y="128" fill="#737373" font-size="11">// stateless</text>
      <text x="16" y="146" fill="#737373" font-size="11">// for_update_skip_locked</text>
    </g>
    <g transform="translate(520, 0)">
      <rect x="0" y="0" width="240" height="160" fill="#f5f1e8" stroke="#0a0a0a" stroke-width="1.5"/>
      <text x="16" y="32" fill="#737373" font-size="11">STATES</text>
      <text x="16" y="100" fill="#0a0a0a" font-size="56" font-weight="700">13</text>
      <text x="16" y="128" fill="#737373" font-size="11">// pipeline states</text>
      <text x="16" y="146" fill="#737373" font-size="11">// with full audit log</text>
    </g>
    <g transform="translate(780, 0)">
      <rect x="0" y="0" width="260" height="160" fill="#f5f1e8" stroke="#0a0a0a" stroke-width="1.5"/>
      <text x="16" y="32" fill="#737373" font-size="11">DEMO COST</text>
      <text x="16" y="100" fill="#166534" font-size="56" font-weight="700">$0</text>
      <text x="16" y="128" fill="#737373" font-size="11">// to run end-to-end</text>
      <text x="16" y="146" fill="#737373" font-size="11">// DEMO_MODE = mocks</text>
    </g>
    <!-- 2 wide cells row -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="500" height="140" fill="#f5f1e8" stroke="#0a0a0a" stroke-width="1.5"/>
      <text x="16" y="32" fill="#737373" font-size="11">STACK</text>
      <g transform="translate(16, 56)" font-size="13" fill="#0a0a0a">
        <text>postgres + pgvector</text>
        <text x="0" y="22">typescript / drizzle / hono / next.js 15</text>
        <text x="0" y="44">n8n orchestration · openai / heygen / pexels</text>
        <text x="0" y="66">ffmpeg post-production · ig graph / tiktok api</text>
      </g>
    </g>
    <g transform="translate(520, 180)">
      <rect x="0" y="0" width="520" height="140" fill="#f5f1e8" stroke="#0a0a0a" stroke-width="1.5"/>
      <text x="16" y="32" fill="#737373" font-size="11">CAPABILITIES</text>
      <g transform="translate(16, 56)" font-size="13">
        <text fill="#166534">[✓] hitl approval gates · auto mode</text>
        <text x="0" y="22" fill="#166534">[✓] pgvector dedup against 90d history</text>
        <text x="0" y="44" fill="#166534">[✓] multi-account + analytics feedback loop</text>
        <text x="0" y="66" fill="#166534">[✓] token rotation · ffmpeg subtitles + cta</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <line x1="80" y1="555" x2="1120" y2="555" stroke="#0a0a0a"/>
  <text x="80" y="585" fill="#737373" font-size="13">github.com/anthonyonazure/social-agent</text>
  <text x="1120" y="585" text-anchor="end" fill="#737373" font-size="13">$ pnpm dev:all</text>
</svg>
