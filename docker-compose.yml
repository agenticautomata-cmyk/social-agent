services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: social_agent_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-social_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-social_agent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-social_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: social_agent_n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-social_agent}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:?set N8N_PASSWORD in .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TZ:-Europe/Berlin}
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Make app DB reachable from n8n with name 'app_db'
      APP_DB_HOST: postgres
      APP_DB_PORT: "5432"
      APP_DB_NAME: ${POSTGRES_DB:-social_agent}
      APP_DB_USER: ${POSTGRES_USER:-social_agent}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # External API credentials passed through to n8n nodes
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HEYGEN_API_KEY: ${HEYGEN_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  voicebox:
    build:
      context: ./docker/voicebox
      dockerfile: Dockerfile
      args:
        VOICEBOX_TAG: v0.5.0
        VOICEBOX_COMMIT: 888043298d91b55b82b5deccb36078260afcb355
    container_name: social_agent_voicebox
    ports:
      - "127.0.0.1:17493:17493"
    environment:
      VOICEBOX_DATA_DIR: /var/lib/voicebox
      BENSON_VOICE_ENGINE: kokoro
      BENSON_VOICE_PRESET_ID: ${BENSON_VOICE_PRESET_ID:-am_echo}
      BENSON_VOICE_PROFILE_NAME: Benson Studio
    volumes:
      - voicebox_data:/var/lib/voicebox
      - voicebox_models:/var/lib/voicebox/huggingface
      - voicebox_work:/tmp/voicebox-work
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
        reservations:
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:17493/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  n8n_data:
  voicebox_data:
  voicebox_models:
  voicebox_work:
